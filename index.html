<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA PenTest+ (PT0-003) | Split Studio</title>
    <link rel="icon" type="image/png" href="pentest-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #000000;
            --bg-panel: #09090b;
            --bg-surface: #111114;
            --bg-surface-elevated: #18181c;
            --bg-surface-hover: #222228;
            
            --border-faint: #1f1f24;
            --border-default: #28282c;
            --border-strong: #3f3f46;
            
            --text-heading: #fafafa;
            --text-body: #d4d4d8;
            --text-muted: #71717a;
            --text-faint: #52525b;
            
            --brand-primary: #3b82f6;
            --brand-glow: rgba(59, 130, 246, 0.15);
            
            --accent-green: #22c55e;
            --accent-green-bg: rgba(34, 197, 94, 0.08);
            --accent-green-border: rgba(34, 197, 94, 0.35);
            
            --accent-red: #ef4444;
            --accent-red-bg: rgba(239, 68, 68, 0.08);
            --accent-red-border: rgba(239, 68, 68, 0.35);
            
            --accent-amber: #f59e0b;
            --accent-amber-bg: rgba(245, 158, 11, 0.08);
            --accent-amber-border: rgba(245, 158, 11, 0.35);
            
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-canvas);
            color: var(--text-body);
            font-family: var(--font-sans);
        }

        /* App Root Grid: Top Bar + Split Workspace + Bottom Status */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Top Bar - Omarchy Header Style */
        .top-navbar {
            height: 48px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-pill {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            background: #ffffff;
            color: #000000;
            padding: 2px 7px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 11px;
            font-family: var(--font-mono);
            display: none;
        }
        @media (min-width: 768px) { .brand-sub { display: inline; } }

        /* Top Bar Segmented Controls */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .segmented-group {
            display: flex;
            background: var(--bg-canvas);
            border: 1px solid var(--border-default);
            padding: 2px;
            gap: 2px;
        }

        .btn-segment {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.12s ease;
            text-transform: uppercase;
        }

        .btn-segment:hover {
            color: var(--text-heading);
            background: var(--bg-surface);
        }

        .btn-segment.active {
            background: var(--bg-surface-elevated);
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-square {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            color: var(--text-body);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-square:hover {
            border-color: var(--border-strong);
            color: #fff;
            background: var(--bg-surface-hover);
        }

        /* Countdown Timer in Header */
        .exam-timer-pill {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            letter-spacing: 0.05em;
        }
        .exam-timer-pill.active {
            display: inline-flex;
        }

        /* Split Workspace: Left (Question/Options) | Right (Navigator/Stats) */
        .split-workspace {
            flex: 1;
            display: flex;
            min-height: 0;
            width: 100%;
        }

        /* Left Section: Question Reader & Option Stack */
        .workspace-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-default);
            background: var(--bg-canvas);
        }

        .question-stage {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* Exam Mode Banner */
        .exam-banner-alert {
            display: none;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-default);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            justify-content: space-between;
            align-items: center;
        }
        .exam-banner-alert.active {
            display: flex;
        }
        .exam-banner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .exam-banner-info span {
            color: var(--text-heading);
            font-weight: 600;
        }

        /* Omarchy Meta Tag Bar */
        .question-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-faint);
            flex-shrink: 0;
        }

        .q-badge-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .q-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-default);
            color: var(--text-heading);
            padding: 3px 8px;
        }

        .domain-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            border: 1px solid var(--border-faint);
            padding: 3px 8px;
        }

        .multi-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent-amber);
            border: 1px solid var(--accent-amber-border);
            background: var(--accent-amber-bg);
            padding: 3px 8px;
            text-transform: uppercase;
        }

        .question-title {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-heading);
            font-weight: 500;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        /* Option Item - Omarchy Grid Card Style */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .option-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-default);
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            user-select: none;
        }

        .option-box:hover {
            border-color: var(--border-strong);
            background: var(--bg-surface);
        }

        .option-indicator {
            width: 22px;
            height: 22px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-default);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.1s ease;
        }

        .option-content {
            font-size: 13.5px;
            line-height: 1.45;
            color: var(--text-body);
        }

        /* Option Selection & State styles */
        .option-box.selected {
            border-color: #52525b;
            background: var(--bg-surface-elevated);
        }
        .option-box.selected .option-indicator {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .option-box.correct {
            border-color: var(--accent-green) !important;
            background: var(--accent-green-bg) !important;
        }
        .option-box.correct .option-indicator {
            background: var(--accent-green) !important;
            color: #000000 !important;
            border-color: var(--accent-green) !important;
        }

        .option-box.incorrect {
            border-color: var(--accent-red) !important;
            background: var(--accent-red-bg) !important;
        }
        .option-box.incorrect .option-indicator {
            background: var(--accent-red) !important;
            color: #ffffff !important;
            border-color: var(--accent-red) !important;
        }

        .option-box.show-correct {
            border-color: var(--accent-green) !important;
            border-style: dashed !important;
            background: var(--accent-green-bg) !important;
        }
        .option-box.show-correct .option-indicator {
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
        }

        /* Banner Feedback */
        .feedback-strip {
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 10px 14px;
            border: 1px solid transparent;
            margin-bottom: 16px;
            display: none;
            flex-shrink: 0;
        }
        .feedback-strip.correct {
            display: block;
            background: var(--accent-green-bg);
            border-color: var(--accent-green-border);
            color: var(--accent-green);
        }
        .feedback-strip.incorrect {
            display: block;
            background: var(--accent-red-bg);
            border-color: var(--accent-red-border);
            color: var(--accent-red);
        }

        /* Bottom Command Dock */
        .workspace-dock {
            height: 52px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .dock-btn {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            padding: 7px 16px;
            cursor: pointer;
            transition: all 0.12s ease;
            text-transform: uppercase;
            border: 1px solid var(--border-default);
            background: var(--bg-surface);
            color: var(--text-body);
        }

        .dock-btn:hover:not(:disabled) {
            border-color: var(--border-strong);
            color: #ffffff;
            background: var(--bg-surface-hover);
        }

        .dock-btn-primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 700;
        }

        .dock-btn-primary:hover:not(:disabled) {
            background: #e4e4e7;
            color: #000000;
            border-color: #e4e4e7;
        }

        .dock-btn-finish {
            background: #f43f5e;
            color: #ffffff;
            border-color: #f43f5e;
            font-weight: 700;
            display: none;
        }
        .dock-btn-finish.active {
            display: inline-block;
        }
        .dock-btn-finish:hover:not(:disabled) {
            background: #e11d48;
            border-color: #e11d48;
        }

        .dock-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Right Section: Split Navigator Sidebar */
        .workspace-sidebar {
            width: 320px;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        /* Metrics Grid in Sidebar */
        .sidebar-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--border-default);
            border-bottom: 1px solid var(--border-default);
        }

        .metric-cell {
            background: var(--bg-panel);
            padding: 10px 14px;
        }

        .metric-lbl {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .metric-num {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-heading);
        }

        .metric-num.pass { color: var(--accent-green); }
        .metric-num.fail { color: var(--accent-red); }

        /* Question Matrix Grid */
        .sidebar-grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .omarchy-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .grid-cell:hover {
            color: #ffffff;
            border-color: var(--border-strong);
            background: var(--bg-surface-hover);
        }

        .grid-cell.current {
            border-color: #ffffff;
            color: #ffffff;
            background: var(--bg-surface-elevated);
            outline: 1px solid #ffffff;
        }

        .grid-cell.attempted {
            border-color: #52525b;
            color: #ffffff;
            background: var(--bg-surface-elevated);
        }

        .grid-cell.correct {
            background: var(--accent-green-bg);
            border-color: var(--accent-green-border);
            color: var(--accent-green);
        }

        .grid-cell.incorrect {
            background: var(--accent-red-bg);
            border-color: var(--accent-red-border);
            color: var(--accent-red);
        }

        /* Jump Bar in Sidebar Footer */
        .sidebar-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--border-default);
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jump-input {
            width: 60px;
            background: var(--bg-canvas);
            border: 1px solid var(--border-default);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 4px 6px;
            text-align: center;
        }
        .jump-input:focus {
            outline: none;
            border-color: var(--border-strong);
        }

        /* Result Splash State */
        .results-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-canvas);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .results-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-default);
            max-width: 520px;
            width: 100%;
            padding: 36px 32px;
            text-align: center;
        }

        .results-verdict {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .results-verdict.pass {
            background: var(--accent-green-bg);
            border: 1px solid var(--accent-green-border);
            color: var(--accent-green);
        }
        .results-verdict.fail {
            background: var(--accent-red-bg);
            border: 1px solid var(--accent-red-border);
            color: var(--accent-red);
        }

        .results-score-scale {
            font-family: var(--font-mono);
            font-size: 52px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 4px;
        }

        .results-score-scale span {
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Custom Minimal Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-default);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }

        @media (max-width: 840px) {
            .workspace-sidebar {
                display: none;
            }
            .question-stage {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Top Navigation -->
        <header class="top-navbar">
            <div class="nav-brand">
                <span class="brand-pill">PT0-003</span>
                <span class="brand-title">CompTIA PenTest+ <span class="brand-sub">/ Exam Studio</span></span>
            </div>

            <!-- Countdown Pill in Exam Mode -->
            <div class="exam-timer-pill" id="exam-timer-badge">
                <span>⏱</span> <span id="timer-display">02:45:00</span>
            </div>

            <div class="nav-controls">
                <div class="segmented-group">
                    <button class="btn-segment active" id="tab-premium" onclick="switchTab('premium')">
                        Bank A (<span id="premium-count">294</span>)
                    </button>
                    <button class="btn-segment" id="tab-marks4sure" onclick="switchTab('marks4sure')">
                        Bank B (<span id="marks4sure-count">240</span>)
                    </button>
                </div>

                <div class="segmented-group">
                    <button class="btn-segment active" id="mode-practice" onclick="setMode('practice')">Practice</button>
                    <button class="btn-segment" id="mode-exam" onclick="setMode('exam')">Exam Mode</button>
                </div>

                <button class="btn-square" onclick="shuffleQuestions()">Shuffle</button>
            </div>
        </header>

        <!-- Main Split Workspace -->
        <div class="split-workspace">
            <!-- Left Panel: Active Question Stage -->
            <main class="workspace-main">
                <div class="question-stage">
                    <!-- Exam Mode Status Bar -->
                    <div class="exam-banner-alert" id="exam-banner">
                        <div class="exam-banner-info">
                            <div>EXAM: <span>PT0-003</span></div>
                            <div>ITEMS: <span>90 MAX</span></div>
                            <div>PASS MARK: <span>750 / 900</span></div>
                        </div>
                        <div style="color: var(--accent-amber); font-weight: 600;">SIMULATION RUNNING</div>
                    </div>

                    <div class="question-header-row">
                        <div class="q-badge-wrap">
                            <span class="q-badge" id="question-number">Q 1</span>
                            <span class="domain-tag" id="question-category" style="display: none;">DOMAIN</span>
                        </div>
                        <span class="multi-tag" id="multi-select-notice" style="display: none;">Multiple Answers</span>
                    </div>

                    <div class="question-title" id="question-text">Initializing exam dataset...</div>

                    <div class="options-list" id="options"></div>

                    <div class="feedback-strip" id="result-message"></div>
                </div>

                <!-- Bottom Sticky Control Bar -->
                <footer class="workspace-dock">
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <img src="pentest-logo.png" alt="CompTIA PenTest+" style="height: 32px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" title="CompTIA PenTest+ Certified">
                        <div style="display: flex; gap: 8px;">
                            <button class="dock-btn" id="prev-btn" onclick="prevQuestion()">Previous</button>
                            <button class="dock-btn" id="next-btn" onclick="nextQuestion()">Next</button>
                        </div>
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <button class="dock-btn dock-btn-primary" id="check-btn" onclick="checkAnswer()">Verify Answer</button>
                        <button class="dock-btn dock-btn-finish" id="finish-exam-btn" onclick="finishExamPrompt()">Submit Exam</button>
                    </div>
                </footer>
            </main>

            <!-- Right Panel: Matrix Navigator & Realtime Stats -->
            <aside class="workspace-sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title" id="sidebar-status-title">Session Progress</span>
                    <span class="brand-pill" id="score-percent">0%</span>
                </div>

                <div class="sidebar-metrics">
                    <div class="metric-cell">
                        <span class="metric-lbl">Current / Total</span>
                        <span class="metric-num"><span id="current-q">1</span>/<span id="total-q">0</span></span>
                    </div>
                    <div class="metric-cell">
                        <span class="metric-lbl">Answered</span>
                        <span class="metric-num"><span id="answered-count">0</span></span>
                    </div>
                    <div class="metric-cell">
                        <span class="metric-lbl" id="metric-3-label">Correct</span>
                        <span class="metric-num pass" id="correct-count">0</span>
                    </div>
                    <div class="metric-cell">
                        <span class="metric-lbl" id="metric-4-label">Incorrect</span>
                        <span class="metric-num fail" id="incorrect-count">0</span>
                    </div>
                </div>

                <div class="sidebar-grid-container">
                    <div class="omarchy-grid" id="question-grid"></div>
                </div>

                <div class="sidebar-footer">
                    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">Jump:</span>
                    <input type="number" id="jump-input" class="jump-input" min="1" placeholder="#" onkeypress="handleJump(event)">
                    <button class="btn-square" style="padding: 4px 10px;" onclick="jumpToQuestion()">Go</button>
                </div>
            </aside>
        </div>

        <!-- Fullscreen Result Splash (Exam Complete) -->
        <div class="results-overlay" id="final-results">
            <div class="results-box">
                <div class="results-verdict" id="results-verdict">PASS</div>
                <div class="results-score-scale" id="comp-scaled-score">780 <span>/ 900</span></div>
                <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 12px;" id="passing-info">Passing Score: 750 / 900</div>
                <p id="final-stats" style="font-family: var(--font-mono); font-size: 12px; color: var(--text-body); margin-bottom: 24px;"></p>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button class="dock-btn dock-btn-primary" onclick="restartQuiz()">New Attempt</button>
                    <button class="dock-btn" onclick="reviewMistakes()">Review All Answers</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionSets = {
            premium: { file: 'questions.json', questions: [], answered: {} },
            marks4sure: { file: 'questions2.json', questions: [], answered: {} }
        };

        let currentTab = 'premium';
        let rawQuestions = [];
        let questions = [];
        let currentIndex = 0;
        let selectedOptions = [];
        let answered = {};
        let mode = 'practice';

        // CompTIA PT0-003 Official Exam Standards
        const EXAM_DURATION_SECONDS = 165 * 60; // 165 minutes = 9900 seconds
        const EXAM_MAX_QUESTIONS = 90;
        const PASSING_SCORE = 750; // out of 900
        let timerInterval = null;
        let timeRemaining = EXAM_DURATION_SECONDS;

        async function loadQuestions() {
            try {
                const [premiumRes, marks4sureRes] = await Promise.all([
                    fetch('questions.json'),
                    fetch('questions2.json')
                ]);

                questionSets.premium.questions = await premiumRes.json();
                questionSets.marks4sure.questions = await marks4sureRes.json();

                document.getElementById('premium-count').textContent = questionSets.premium.questions.length;
                document.getElementById('marks4sure-count').textContent = questionSets.marks4sure.questions.length;

                switchTab('premium');
            } catch (error) {
                console.error('Error loading questions:', error);
                document.getElementById('question-text').textContent = 'Error loading datasets. Verify questions.json files.';
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;

            document.getElementById('tab-premium').classList.toggle('active', tabName === 'premium');
            document.getElementById('tab-marks4sure').classList.toggle('active', tabName === 'marks4sure');

            rawQuestions = [...questionSets[tabName].questions];
            prepareQuestionsForMode();
        }

        function prepareQuestionsForMode() {
            if (mode === 'exam') {
                // Shuffle and pick maximum 90 questions for authentic CompTIA Exam
                const shuffled = [...rawQuestions].sort(() => 0.5 - Math.random());
                questions = shuffled.slice(0, Math.min(EXAM_MAX_QUESTIONS, shuffled.length));
                startExamTimer();
            } else {
                questions = [...rawQuestions];
                stopExamTimer();
            }

            answered = {};
            currentIndex = 0;
            selectedOptions = [];

            document.getElementById('total-q').textContent = questions.length;
            document.getElementById('jump-input').max = questions.length;

            updateStats();
            renderQuestion();
            renderQuestionGrid();

            document.getElementById('final-results').style.display = 'none';
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('mode-practice').classList.toggle('active', newMode === 'practice');
            document.getElementById('mode-exam').classList.toggle('active', newMode === 'exam');

            const isExam = mode === 'exam';
            document.getElementById('check-btn').style.display = isExam ? 'none' : 'inline-block';
            document.getElementById('finish-exam-btn').classList.toggle('active', isExam);
            document.getElementById('exam-banner').classList.toggle('active', isExam);
            document.getElementById('exam-timer-badge').classList.toggle('active', isExam);

            // In exam mode, hide live correct/incorrect stats to simulate real test
            document.getElementById('metric-3-label').textContent = isExam ? 'Remaining' : 'Correct';
            document.getElementById('metric-4-label').textContent = isExam ? 'Mark' : 'Incorrect';

            prepareQuestionsForMode();
        }

        function startExamTimer() {
            stopExamTimer();
            timeRemaining = EXAM_DURATION_SECONDS;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    stopExamTimer();
                    alert("CompTIA PenTest+ Exam duration (165 minutes) has expired! Submitting answers automatically.");
                    showFinalResults();
                }
            }, 1000);
        }

        function stopExamTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timeRemaining / 3600);
            const minutes = Math.floor((timeRemaining % 3600) / 60);
            const seconds = timeRemaining % 60;

            const formatted = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timer-display').textContent = formatted;
        }

        function shuffleQuestions() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            currentIndex = 0;
            answered = {};
            updateStats();
            renderQuestion();
            renderQuestionGrid();
        }

        function isMultiSelect(q) {
            return Array.isArray(q.correct) && q.correct.length > 1;
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                showFinalResults();
                return;
            }

            const q = questions[currentIndex];
            const multiSelect = isMultiSelect(q);

            document.getElementById('current-q').textContent = currentIndex + 1;
            document.getElementById('question-number').textContent = `Q ${currentIndex + 1} / ${questions.length} (#${q.id})`;
            document.getElementById('question-text').textContent = q.question;

            const categoryEl = document.getElementById('question-category');
            if (q.category) {
                categoryEl.textContent = q.category;
                categoryEl.style.display = 'inline-block';
            } else {
                categoryEl.style.display = 'none';
            }

            document.getElementById('multi-select-notice').style.display = multiSelect ? 'inline-block' : 'none';

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            const optionLetters = Object.keys(q.options).sort();

            optionLetters.forEach(letter => {
                if (q.options[letter]) {
                    const opt = document.createElement('div');
                    opt.className = 'option-box';
                    opt.setAttribute('data-letter', letter);
                    opt.innerHTML = `
                        <div class="option-indicator">${letter}</div>
                        <div class="option-content">${q.options[letter]}</div>
                    `;
                    opt.onclick = () => selectOption(letter, multiSelect);

                    if (answered[currentIndex]) {
                        const ans = answered[currentIndex];
                        const isSelected = Array.isArray(ans.selected)
                            ? ans.selected.includes(letter)
                            : ans.selected === letter;

                        if (isSelected) {
                            opt.classList.add('selected');
                            if (ans.checked && mode === 'practice') {
                                const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
                                opt.classList.add(correctAnswers.includes(letter) ? 'correct' : 'incorrect');
                            }
                        }
                        if (ans.checked && mode === 'practice') {
                            const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
                            if (correctAnswers.includes(letter) && !ans.isCorrect) {
                                opt.classList.add('show-correct');
                            }
                        }
                    }

                    optionsDiv.appendChild(opt);
                }
            });

            if (answered[currentIndex]) {
                selectedOptions = Array.isArray(answered[currentIndex].selected)
                    ? [...answered[currentIndex].selected]
                    : [answered[currentIndex].selected];
            } else {
                selectedOptions = [];
            }

            const resultMsg = document.getElementById('result-message');
            if (answered[currentIndex]?.checked && mode === 'practice') {
                const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
                resultMsg.className = 'feedback-strip ' + (answered[currentIndex].isCorrect ? 'correct' : 'incorrect');
                resultMsg.textContent = answered[currentIndex].isCorrect ?
                    'Correct response verified.' :
                    `Incorrect. Expected answer${correctAnswers.length > 1 ? 's' : ''}: ${correctAnswers.join(', ')}`;
            } else {
                resultMsg.className = 'feedback-strip';
            }

            document.getElementById('check-btn').disabled = (answered[currentIndex]?.checked && mode === 'practice') || false;

            highlightCurrentInGrid();
        }

        function selectOption(letter, multiSelect) {
            if (answered[currentIndex]?.checked && mode === 'practice') return;

            if (multiSelect) {
                const index = selectedOptions.indexOf(letter);
                if (index > -1) {
                    selectedOptions.splice(index, 1);
                } else {
                    selectedOptions.push(letter);
                }
            } else {
                selectedOptions = [letter];
            }

            document.querySelectorAll('.option-box').forEach(opt => {
                const optLetter = opt.getAttribute('data-letter');
                opt.classList.toggle('selected', selectedOptions.includes(optLetter));
            });

            const q = questions[currentIndex];
            const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
            const isCorrect = multiSelect
                ? selectedOptions.length === correctAnswers.length &&
                  selectedOptions.every(s => correctAnswers.includes(s))
                : selectedOptions[0] === correctAnswers[0];

            answered[currentIndex] = {
                selected: multiSelect ? [...selectedOptions] : selectedOptions[0],
                checked: mode === 'exam', // in exam mode, it marks as completed without showing results
                isCorrect: isCorrect
            };

            updateStats();
            renderQuestionGrid();
        }

        function checkAnswer() {
            if (selectedOptions.length === 0 || answered[currentIndex]?.checked) return;

            const q = questions[currentIndex];
            const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
            const multiSelect = isMultiSelect(q);

            const isCorrect = multiSelect
                ? selectedOptions.length === correctAnswers.length &&
                  selectedOptions.every(s => correctAnswers.includes(s))
                : selectedOptions[0] === correctAnswers[0];

            answered[currentIndex] = {
                selected: multiSelect ? [...selectedOptions] : selectedOptions[0],
                checked: true,
                isCorrect: isCorrect
            };

            document.querySelectorAll('.option-box').forEach(opt => {
                const letter = opt.getAttribute('data-letter');
                const isSelected = selectedOptions.includes(letter);
                const isCorrectOption = correctAnswers.includes(letter);

                if (isSelected) {
                    opt.classList.add(isCorrectOption ? 'correct' : 'incorrect');
                }
                if (!isCorrect && isCorrectOption && !isSelected) {
                    opt.classList.add('show-correct');
                }
            });

            const resultMsg = document.getElementById('result-message');
            resultMsg.className = 'feedback-strip ' + (isCorrect ? 'correct' : 'incorrect');
            resultMsg.textContent = isCorrect ?
                'Correct response verified.' :
                `Incorrect. Expected answer${correctAnswers.length > 1 ? 's' : ''}: ${correctAnswers.join(', ')}`;

            document.getElementById('check-btn').disabled = true;

            updateStats();
            renderQuestionGrid();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else if (mode === 'exam') {
                finishExamPrompt();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function finishExamPrompt() {
            let answeredTotal = 0;
            Object.values(answered).forEach(ans => {
                if (ans.selected && (Array.isArray(ans.selected) ? ans.selected.length > 0 : true)) answeredTotal++;
            });

            const unanswered = questions.length - answeredTotal;
            const confirmMsg = unanswered > 0
                ? `You still have ${unanswered} unanswered question(s). Are you sure you want to finalize and grade your CompTIA PenTest+ exam now?`
                : `Are you sure you want to submit your CompTIA PenTest+ exam?`;

            if (confirm(confirmMsg)) {
                stopExamTimer();
                showFinalResults();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const num = parseInt(input.value);
            if (num >= 1 && num <= questions.length) {
                currentIndex = num - 1;
                renderQuestion();
            }
            input.value = '';
        }

        function handleJump(event) {
            if (event.key === 'Enter') {
                jumpToQuestion();
            }
        }

        function updateStats() {
            let correct = 0;
            let incorrect = 0;
            let answeredTotal = 0;

            Object.values(answered).forEach(ans => {
                if (ans.selected && (Array.isArray(ans.selected) ? ans.selected.length > 0 : true)) {
                    answeredTotal++;
                }
                if (ans.isCorrect) correct++;
                else if (ans.selected) incorrect++;
            });

            document.getElementById('answered-count').textContent = answeredTotal;

            if (mode === 'exam') {
                document.getElementById('correct-count').textContent = questions.length - answeredTotal;
                document.getElementById('incorrect-count').textContent = 'PT0-003';
                const progressPct = Math.round((answeredTotal / questions.length) * 100);
                document.getElementById('score-percent').textContent = progressPct + '%';
            } else {
                document.getElementById('correct-count').textContent = correct;
                document.getElementById('incorrect-count').textContent = incorrect;
                const totalAttempted = correct + incorrect;
                const percent = totalAttempted > 0 ? Math.round((correct / totalAttempted) * 100) : 0;
                document.getElementById('score-percent').textContent = percent + '%';
            }
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';

            questions.forEach((q, index) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = index + 1;
                cell.onclick = () => {
                    currentIndex = index;
                    renderQuestion();
                };

                if (answered[index]) {
                    if (mode === 'practice') {
                        if (answered[index].checked) {
                            cell.classList.add(answered[index].isCorrect ? 'correct' : 'incorrect');
                        }
                    } else {
                        // In exam mode, just show that it was attempted without revealing right/wrong
                        if (answered[index].selected) {
                            cell.classList.add('attempted');
                        }
                    }
                }

                if (index === currentIndex) {
                    cell.classList.add('current');
                }

                grid.appendChild(cell);
            });
        }

        function highlightCurrentInGrid() {
            document.querySelectorAll('.grid-cell').forEach((cell, index) => {
                cell.classList.toggle('current', index === currentIndex);
            });
        }

        function showFinalResults() {
            document.getElementById('final-results').style.display = 'flex';

            let correct = 0;
            let total = questions.length;

            Object.values(answered).forEach(ans => {
                if (ans.isCorrect) correct++;
            });

            // CompTIA PenTest+ scale: 100 to 900 scale
            // Score = 100 + (correct / total) * 800
            const scaledScore = Math.round(100 + (correct / total) * 800);
            const isPassed = scaledScore >= PASSING_SCORE;

            const verdictEl = document.getElementById('results-verdict');
            verdictEl.textContent = isPassed ? 'PASSED / CERTIFIED' : 'FAILED / DID NOT PASS';
            verdictEl.className = 'results-verdict ' + (isPassed ? 'pass' : 'fail');

            document.getElementById('comp-scaled-score').innerHTML = `${scaledScore} <span>/ 900</span>`;
            
            const rawPercent = Math.round((correct / total) * 100);
            document.getElementById('final-stats').textContent =
                `Raw Score: ${correct}/${total} correct (${rawPercent}%). You needed at least 750/900 to pass CompTIA PT0-003.`;
        }

        function restartQuiz() {
            prepareQuestionsForMode();
        }

        function reviewMistakes() {
            document.getElementById('final-results').style.display = 'none';
            // Enable practice mode inspection so user can review every answer
            mode = 'practice';
            document.getElementById('mode-practice').classList.add('active');
            document.getElementById('mode-exam').classList.remove('active');
            document.getElementById('exam-banner').classList.remove('active');
            document.getElementById('exam-timer-badge').classList.remove('active');
            document.getElementById('check-btn').style.display = 'inline-block';
            document.getElementById('finish-exam-btn').classList.remove('active');

            // Force reveal right/wrong in answers
            Object.keys(answered).forEach(k => {
                answered[k].checked = true;
            });

            updateStats();
            currentIndex = 0;
            renderQuestion();
            renderQuestionGrid();
        }

        loadQuestions();
    </script>
</body>
</html>
